[package]
name = "aif"
version = "4.0.0"
edition = "2021"
authors = ["Bhoid"]
description = "Deterministic, model-agnostic, local-first version control & state checkpoints for LLMs and agents"

[lib]
name = "aif"
path = "src/lib.rs"

[[bin]]
name = "aif"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1.0"
rand = "0.8"
ctrlc = { version = "3.4", features = ["termination"] }
dirs = "5.0"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
